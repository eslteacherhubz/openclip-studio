name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: pip install ruff
      - run: ruff check src tests

  mypy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package + mypy (extras provide stubs for gui/gaze)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,gui,gaze]"
      - name: Enforce mypy --strict on src/ (Stage 4 gate)
        run: mypy

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install package + dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Show ffmpeg
        run: ffmpeg -version | head -1
      - name: Run tests (ASR integration auto-skips in CI)
        run: pytest -v

  gui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Qt system libraries
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libglib2.0-0 libdbus-1-3 libfontconfig1 libpulse0
      - name: Install package with gui extra
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,gui]"
      - name: Run GUI tests offscreen
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest -v -m gui

  gaze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package with gaze extra
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,gaze]"
      - name: Run gaze research tests (synthetic rig)
        run: pytest -v -m gaze

  test-windows:
    runs-on: windows-latest
    strategy:
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Ensure ffmpeg (preinstalled on windows runners; install if absent)
        run: |
          if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue)) {
            choco install -y ffmpeg
          }
          ffmpeg -version | Select-Object -First 1
      - name: Install package + dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run engine tests on Windows (extras auto-skip)
        run: pytest -v -m "not (gui or gaze)"

  package-windows:
    runs-on: windows-latest
    needs: [lint, mypy]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install app + all feature extras + pyinstaller
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[gui,asr,gaze,dev]"
          pip install pyinstaller
      - name: Build one-folder package
        run: pyinstaller --noconfirm packaging/openclip.spec
      - name: Smoke-test packaged CLI
        run: |
          dist\OpenClipStudio\OpenClipCLI.exe --version
          dist\OpenClipStudio\OpenClipCLI.exe probe --help
      - name: Verify frozen video export (synth, edit, export, probe-assert)
        run: |
          dist\OpenClipStudio\OpenClipCLI.exe synth --out smoke.mp4
          "Hello everyone, welcome to the lesson. :: 大家好`n`nToday we learn five new words. :: 今天学五个新单词。" | Out-File -Encoding utf8 smoke_script.txt
          dist\OpenClipStudio\OpenClipCLI.exe new --media smoke.mp4 --script smoke_script.txt -o smoke.json
          dist\OpenClipStudio\OpenClipCLI.exe auto smoke.json -o smoke_out.mp4 -t even
          $info = dist\OpenClipStudio\OpenClipCLI.exe probe smoke_out.mp4 | ConvertFrom-Json
          if ($info.vcodec -ne "h264") { throw "expected h264, got $($info.vcodec)" }
          if ($info.acodec -ne "aac") { throw "expected aac, got $($info.acodec)" }
          if ($info.duration_s -le 5) { throw "export too short: $($info.duration_s)" }
          Write-Host "frozen export OK: $($info.duration_s)s h264/aac"
      - name: Verify bundled gaze (opencv + cascades in the frozen app)
        run: |
          dist\OpenClipStudio\OpenClipCLI.exe gaze-analyze smoke.mp4 --max-frames 3
      - name: Verify bundled whisper (SAPI speech + first-use model download)
        run: |
          Add-Type -AssemblyName System.Speech
          $tts = New-Object System.Speech.Synthesis.SpeechSynthesizer
          $tts.SetOutputToWaveFile("speech.wav")
          $tts.Speak("Hello everyone, welcome to the lesson. Today we will learn five new words. Please listen and repeat after me.")
          $tts.Dispose()
          "Hello everyone, welcome to the lesson.`n`nToday we will learn five new words.`n`nPlease listen and repeat after me." | Out-File -Encoding utf8 speech_script.txt
          dist\OpenClipStudio\OpenClipCLI.exe new --media speech.wav --script speech_script.txt -o speech.json
          dist\OpenClipStudio\OpenClipCLI.exe align speech.json -t whisper --language en
      - name: Verify packaged GUI launches (offscreen, stays alive)
        run: |
          $env:QT_QPA_PLATFORM = "offscreen"
          $p = Start-Process -FilePath "dist\OpenClipStudio\OpenClipStudio.exe" -PassThru
          Start-Sleep -Seconds 15
          if ($p.HasExited) { throw "GUI exited early with code $($p.ExitCode)" }
          Stop-Process -Id $p.Id -Force
          Write-Host "GUI stayed alive for 15s"
      - name: Archive package
        run: Compress-Archive -Path dist\OpenClipStudio -DestinationPath OpenClipStudio-windows-x64.zip
      - name: Checksum
        run: Get-FileHash OpenClipStudio-windows-x64.zip -Algorithm SHA256 | Out-File sha256.txt
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenClipStudio-windows-x64
          path: |
            OpenClipStudio-windows-x64.zip
            sha256.txt
          retention-days: 14
